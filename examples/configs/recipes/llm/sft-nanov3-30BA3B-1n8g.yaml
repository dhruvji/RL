defaults: ../../sft.yaml
sft:
  max_num_steps: 12000
  # MoE + long context: keep validation batch modest (inherits 32 from ../../sft.yaml otherwise).
  val_global_batch_size: 8
checkpointing:
  enabled: true
  checkpoint_dir: /scratch/dhruv/sft/sft-nanov3-30BA3B-1n8g
  save_period: 50
policy:
  model_name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-Base-BF16
  # ../../sft.yaml sets a Llama-style demo chat_template; override with Nemotron's template.
  # Base-BF16 tokenizer_config.json has no chat_template field; the same-family BF16 repo ships it.
  tokenizer:
    name: nvidia/NVIDIA-Nemotron-3-Nano-30B-A3B-BF16
    chat_template: default
    chat_template_kwargs: null
  # One sample per GPU; global batch = 8 matches 8 ranks (see train_micro_batch_size).
  train_global_batch_size: 8
  train_micro_batch_size: 1
  max_total_sequence_length: 8192
  dtensor_cfg:
    # FSDP parameter offload to CPU: lowers GPU VRAM, slower steps (see dpo-nanov3-*-cpuoffload recipes).
    cpu_offload: true
    # Shard experts across 8 GPUs (default EP=1 replicates all experts per GPU and OOMs fast).
    expert_parallel_size: 8
    # Saves activation memory on backward; required mesh: (dp*cp) % ep == 0 (8 % 8 here).
    activation_checkpointing: true
    # Do not set clear_cache_every_n_steps with train_micro_batch_size: 1: mb_idx is always 0, so
    # torch.cuda.empty_cache() runs every step and destroys utilization (see dtensor_policy_worker_v2).
    # Nemotron-H loads via HuggingFace trust_remote_code; TE/DeepEP ``BackendConfig`` in
    # automodel_kwargs only applies to NeMo ModelRegistry MoE models (e.g. Qwen3Moe, Glm4Moe).
    # For that stack see examples/configs/recipes/llm/grpo-moonlight-16b-automodel-1n8g-ep8.yaml.
    env_vars:
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
logger:
  log_dir: /scratch/dhruv/sft/sft-nanov3-30BA3B-1n8g-logs
  wandb:
    project: nemo-rl
    name: sft-nanov3-30BA3B-1n8g
  tensorboard:
    log_dir: /scratch/dhruv/sft/sft-nanov3-30BA3B-1n8g-logs
  mlflow:
    run_name: sft-nanov3-30BA3B-1n8g
cluster:
  gpus_per_node: 8
  num_nodes: 1

# Overlap tokenization / collation with GPU work (default 1 often underfeeds the model).
data:
  num_workers: 4

# export TORCH_CUDNN_SDPA_ENABLED=0
# export NEMO_RL_PY_EXECUTABLES_SYSTEM=1
# uv run examples/run_sft.py --config examples/configs/recipes/llm/sft-nanov3-30BA3B-1n8g.yaml